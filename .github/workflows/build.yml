name: android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p src
          unzip -q -o QBOOL.zip -d src
          echo "=== STRUCTURE ==="
          find src -not -path "*/.git/*" | head -n 80

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Find Android project
        id: find
        run: |
          S=$(find src -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$S" ]; then
            echo "settings.gradle NOT FOUND inside the zip"
            exit 1
          fi
          echo "Found: $S"
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"

      - name: Fix timestamps and clean old native build
        run: |
          find src -type f -exec touch {} +
          find src -type d -name .cxx -prune -exec rm -rf {} +

      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QBOOL-apk
          path: "src/**/build/outputs/apk/debug/*.apk"
