name: android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Find Android project
        id: find
        run: |
          G=$(find . -name gradlew -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$G" ]; then
            echo "gradlew NOT FOUND. Repo structure:"
            find . -maxdepth 4 -not -path "./.git/*" | head -n 100
            exit 1
          fi
          echo "Found: $G"
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"

      - name: Fix timestamps and clean old native build
        run: |
          find . -type f -not -path "./.git/*" -exec touch {} +
          find . -type d -name .cxx -prune -exec rm -rf {} +

      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QBOOL-apk
          path: "**/build/outputs/apk/debug/*.apk"
