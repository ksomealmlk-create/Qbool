name: Build Q BOOL

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test game logic
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp build/Release/QBOOL.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: QBOOL-windows
          path: dist

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test game logic
        run: ctest --test-dir build --output-on-failure
      - name: Collect
        run: |
          mkdir dist
          cp build/QBOOL dist/
      - uses: actions/upload-artifact@v4
        with:
          name: QBOOL-linux
          path: dist

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK / NDK / CMake
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.3.11579264"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Collect
        run: |
          mkdir apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/QBOOL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QBOOL-android
          path: apk

  web:
    name: Web (play on phone / browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Configure
        run: emcmake cmake -S . -B build-web -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-web
      - name: Collect
        run: |
          mkdir site
          cp build-web/index.html build-web/index.js build-web/index.wasm site/
      - uses: actions/upload-artifact@v4
        with:
          name: QBOOL-web
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish on GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
