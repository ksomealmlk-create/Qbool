name: android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Fix timestamps and clean old native build
        run: |
          find . -type f -exec touch {} +
          rm -rf proj/QBOOL-1/android/app/.cxx
          rm -rf proj/QBOOL-1/android/app/build

      - name: Build APK
        working-directory: proj/QBOOL-1/android
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QBOOL-apk
          path: proj/QBOOL-1/android/app/build/outputs/apk/debug/*.apk
