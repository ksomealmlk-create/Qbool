name: Build Q BOOL

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            mkdir project
            cd project
            cmake -E tar xf ../QBOOL.zip
            CM=$(find . -maxdepth 3 -name CMakeLists.txt | head -1)
            echo "PROJ=project/$(dirname "$CM")" >> "$GITHUB_ENV"
          fi
      - name: Configure
        shell: bash
        run: cmake -S "$PROJ" -B "$PROJ/build" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash
        run: cmake --build "$PROJ/build" --config Release
      - name: Test game logic
        shell: bash
        run: ctest --test-dir "$PROJ/build" -C Release --output-on-failure
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp "$PROJ/build/Release/QBOOL.exe" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: QBOOL-windows
          path: dist

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            mkdir project
            cd project
            cmake -E tar xf ../QBOOL.zip
            CM=$(find . -maxdepth 3 -name CMakeLists.txt | head -1)
            echo "PROJ=project/$(dirname "$CM")" >> "$GITHUB_ENV"
          fi
      - name: Install libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Configure
        run: cmake -S "$PROJ" -B "$PROJ/build" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build "$PROJ/build" -j
      - name: Test game logic
        run: ctest --test-dir "$PROJ/build" --output-on-failure
      - name: Collect
        run: |
          mkdir dist
          cp "$PROJ/build/QBOOL" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: QBOOL-linux
          path: dist

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            mkdir project
            cd project
            cmake -E tar xf ../QBOOL.zip
            CM=$(find . -maxdepth 3 -name CMakeLists.txt | head -1)
            echo "PROJ=project/$(dirname "$CM")" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        working-directory: ${{ env.PROJ }}/android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Collect
        run: |
          mkdir apk
          cp "$PROJ/android/app/build/outputs/apk/debug/app-debug.apk" apk/QBOOL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QBOOL-android
          path: apk

  web:
    name: Web (play on phone / browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            mkdir project
            cd project
            cmake -E tar xf ../QBOOL.zip
            CM=$(find . -maxdepth 3 -name CMakeLists.txt | head -1)
            echo "PROJ=project/$(dirname "$CM")" >> "$GITHUB_ENV"
          fi
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Configure
        run: emcmake cmake -S "$PROJ" -B "$PROJ/build-web" -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build "$PROJ/build-web"
      - name: Collect
        run: |
          mkdir site
          cp "$PROJ/build-web/index.html" "$PROJ/build-web/index.js" "$PROJ/build-web/index.wasm" site/
      - uses: actions/upload-artifact@v4
        with:
          name: QBOOL-web
          path: site
