name: android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p src
          unzip -q -o QBOOL.zip -d src
          echo "Project structure:"
          find src -maxdepth 4 -not -path "*/.git/*" | head -n 60

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Find Android project
        id: find
        run: |
          G=$(find src -name gradlew | head -n 1)
          if [ -z "$G" ]; then
            echo "gradlew NOT FOUND inside the zip"
            exit 1
          fi
          echo "Found: $G"
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"

      - name: Fix timestamps and clean old native build
        run: |
          find src -type f -exec touch {} +
          find src -type d -name .cxx -prune -exec rm -rf {} +

      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QBOOL-apk
          path: "src/**/build/outputs/apk/debug/*.apk"
