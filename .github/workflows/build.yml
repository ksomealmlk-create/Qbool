android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project (unzip QBOOL.zip if the files are zipped)
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            mkdir project
            cd project
            cmake -E tar xf ../QBOOL.zip
            CM=$(find . -maxdepth 3 -name CMakeLists.txt | head -1)
            echo "PROJ=project/$(dirname "$CM")" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        working-directory: ${{ env.PROJ }}/android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Collect
        run: |
          mkdir apk
          cp "$PROJ/android/app/build/outputs/apk/debug/app-debug.apk" apk/QBOOL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QBOOL-android
          path: apk
